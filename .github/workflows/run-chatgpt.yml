name: Run ChatGPT prompts
on:
  workflow_dispatch:
    inputs:
      rival:
        description: Competitor name
        default: Klaviyo
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prompts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RIVAL: ${{ github.event.inputs.rival }}
        run: python scripts/run_chatgpt.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "ChatGPT run: ${{ github.event.inputs.rival }}" || echo "nothing to commit"
          git push
